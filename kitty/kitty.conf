# Pin the shell. Left at the default, kitty follows $SHELL, which stays stale
# in any session that was started before chsh. Bare name so macOS resolves too.
shell zsh

#font_family         JetBrainsMono Nerd Font Mono
#bold_font           JetBrainsMono Nerd Font Mono Bold
#italic_font         JetBrainsMono Nerd Font Mono Italic
#bold_italic_font    JetBrainsMono Nerd Font Mono Bold Italic

font_family         "DankMono Nerd Font"
bold_font           "DankMono Nerd Font Bold"
italic_font         "DankMono Nerd Font Italic"
bold_italic_font    "DankMono Nerd Font Bold Italic"

font_size 11
adjust_line_height 130%

cursor_blink_interval 0
enable_audio_bell 0
hide_window_decorations titlebar-only
window_padding_width 10

macos_option_as_alt yes

disable_ligatures cursor

# Middle click pastes the system clipboard even when the running program grabbed
# the mouse. tmux with `mouse on` grabs it, and its own MouseDown2Pane binding
# pastes tmux's INTERNAL buffer (`paste-buffer -p`), which is why the scroll-wheel
# click did nothing useful inside tmux. Outside tmux kitty keeps its default here:
# middle click still pastes the PRIMARY selection.
mouse_map middle release grabbed paste_from_clipboard
# ...and the PRESS has to be discarded, or it still reaches the grabbing app:
# tmux answers MouseDown2Pane with `paste-buffer -p`, dumping its own internal
# buffer right before kitty's release-paste lands. Same pairing kitty documents
# for shift+middle in kitty_reference.conf:650.
mouse_map middle press grabbed discard_event

# BEGIN_KITTY_THEME
# Leaf Light
include current-theme.conf
# END_KITTY_THEME
